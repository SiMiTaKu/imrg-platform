version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # IMPORTANT - Please verify your build output directory
    baseDirectory: .svelte-kit/output/prerendered/pages/index.html
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
