version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install $(cat .node-version)
        # package.json の packageManager に書いた版の pnpm を使う
        - corepack enable
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      env:
        PUBLIC_BASE_PATH: 'https//imrg.work'
      commands:
        # web パッケージだけをビルドする
        - pnpm --filter @imrg-platform/web build
  artifacts:
    # IMPORTANT - Please verify your build output directory
    baseDirectory: web/build
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
  customHeaders:
    # 既定。HTML は毎回取りに行き、更新をすぐ反映する
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'
        - key: 'Permissions-Policy'
          value: 'camera=(), microphone=(), geolocation=()'
        - key: 'X-Frame-Options'
          value: 'SAMEORIGIN'
    # ファイル名にハッシュが入るものは長期キャッシュにする
    - pattern: '/_app/immutable/**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
  redirects:
    - source: </oshimitsu/content_type/<*>>
      target: /oshimitsu/content_type/index.html
      status: 200
    - source: </oshimitsu/content_type/<*>/__data.json>
      target: /oshimitsu/content_type/__data.json
      status: 200
    # 英語ページ（/en/）にも同じ書き換えを入れる
    - source: </en/oshimitsu/content_type/<*>>
      target: /en/oshimitsu/content_type/index.html
      status: 200
    - source: </en/oshimitsu/content_type/<*>/__data.json>
      target: /en/oshimitsu/content_type/__data.json
      status: 200
