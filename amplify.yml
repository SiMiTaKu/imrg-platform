version: 1
backend:
  phases:
    preBuild:
      commands:
        - cd src
        - npm ci
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - cd ..
frontend:
  phases:
    preBuild:
      commands:
        - nvm install $(cat .node-version)
        - npm ci
    build:
      env:
        PUBLIC_BASE_PATH: 'https//imrg.work'
      commands:
        - npm run build
  artifacts:
    # IMPORTANT - Please verify your build output directory
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
