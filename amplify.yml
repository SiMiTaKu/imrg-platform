version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 21.4.0
        - nvm use 21
        - npm --version
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # IMPORTANT - Please verify your build output directory
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
