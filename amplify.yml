version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install $(cat .node-version)
        - npm ci
    build:
      env:
        PUBLIC_BASE_PATH: 'https//imrg.work'
      commands:
        - npm run build
  artifacts:
    # IMPORTANT - Please verify your build output directory
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
