version: 2
updates:
  # pnpm の依存（Dependabot では npm として扱う）
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    # 公開直後の版は避ける（pnpm も公開から日の浅い版を入れない）
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    ignore:
      # 型定義は実際に使う Node（.node-version の 24 系）に合わせる。Node を上げるときに一緒に上げる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # textlint 15 では textlint-rule-preset-jtf-style の「カタカナの長音」が検出しなくなる。
      # ルールが対応するまで 14 系にとどめる（docs/TODO.md の 2-3）
      - dependency-name: 'textlint'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # メジャー以外はまとめて1本にする
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    commit-message:
      prefix: 'chore(actions)'
    groups:
      actions:
        patterns:
          - '*'
