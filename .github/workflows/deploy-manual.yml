name: 手動デプロイ（STG）

# 選んだブランチをステージングへ配る。
# ブランチは画面右上の「Run workflow」で選ぶ（コマンドなら --ref で指定する）。
# 本番へは配れない。本番へ入る道は main への PR（自動デプロイ（PROD））だけにする
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: staging
      site_url: https://stg.imrg.work/
      # 取っておくのは本番へ配ったものだけ
      store_release: false
      # ステージングでは規則集の中身を出す。本番は「準備中」のまま
      rules_published: true
