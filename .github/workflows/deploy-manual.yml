name: 手動デプロイ

# 配りたいブランチと配り先を選んで実行する。
# ブランチは画面右上の「Run workflow」で選ぶ（コマンドなら --ref で指定する）
on:
  workflow_dispatch:
    inputs:
      environment:
        description: '配り先'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      release:
        description: '戻したいリリースのコミット（空なら、選んだブランチを作って配る）'
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      site_url: ${{ inputs.environment == 'production' && 'https://imrg.work/' || 'https://stg.imrg.work/' }}
      release: ${{ inputs.release }}
      # 本番へ配ったものだけ、あとで戻せるように取っておく
      store_release: ${{ inputs.environment == 'production' }}
