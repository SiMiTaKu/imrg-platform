name: feature-branch-updated
on:
  pull_request:
    branches:
      - develop
      - feature/*
jobs:
  format_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '16.19.0'
      - run: ls
      - run: npm run format
      - run: npm run lint:fix
      - run: npm run lint
  test_code:
    runs-on: ubuntu-latest
    steps:
      - run: npm run test