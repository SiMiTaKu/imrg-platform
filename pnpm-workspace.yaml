# 依存パッケージのインストール時スクリプトは、許可したものだけ動かす（pnpm 11 以降の既定）
allowBuilds:
  # sass が使う。環境ごとのビルド済みバイナリが入るので、スクリプトは動かさない
  '@parcel/watcher': false

# pnpm は公開されて間もない版を入れない。下はこの設定を入れた時点で公開から1日たっていなかった版。
# 次に版を上げるときに消してよい
minimumReleaseAgeExclude:
  - '@microsoft/tsdoc-config@0.18.2'
  - '@microsoft/tsdoc@0.17.0'
  - eslint-plugin-jsdoc@64.5.2
  - eslint-plugin-tsdoc@0.5.3
  - prettier@3.9.7

# 脆弱性が見つかった間接依存を、修正済みの版に上げる（pnpm audit --fix で追加）
overrides:
  cookie@<0.7.0: ^0.7.0
  diff@>=4.0.0 <4.0.4: ^4.0.4
  diff@>=5.0.0 <5.2.2: ^5.2.2
  # eslint-plugin-tsdoc が古い版（TypeScript 6 未対応）を固定しているので、本体と同じ版にそろえる
  'eslint-plugin-tsdoc>@typescript-eslint/utils': ^8.70.0
  fast-uri@>=3.0.0 <3.1.3: ^3.1.3
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  fast-uri@>=3.0.0 <=3.1.0: ^3.1.1
  fast-uri@>=3.0.0 <=3.1.1: ^3.1.2
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  flatted@<3.4.0: ^3.4.0
  flatted@<=3.4.1: ^3.4.2
  js-yaml@<3.14.2: ^3.14.2
  js-yaml@<3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.1: ^3.15.1
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  lodash@<=4.17.23: ^4.18.1
  lodash@>=4.0.0 <=4.17.22: ^4.17.23
  lodash@>=4.0.0 <=4.17.23: ^4.18.1
  picomatch@<2.3.2: ^2.3.2
